spring.application.name=web-ide
server.port=8080
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Local Docker PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/efide
spring.datasource.username=efide
spring.datasource.password=efide1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=efide-secret-key-please-change-this-in-production
jwt.access-expiration=3600000
jwt.refresh-expiration=2592000000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379